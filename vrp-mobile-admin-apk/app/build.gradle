plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vitalityroleplay.admin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vitalityroleplay.admin'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
