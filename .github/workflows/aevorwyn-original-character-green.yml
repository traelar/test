name: Aevorwyn original character GREEN

on:
  push:
    branches: [ aevorwyn-mobile-build ]
    paths:
      - '.aevorwyn/original-character-green-trigger.txt'
  workflow_dispatch:

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact v7 baseline
        run: |
          bash .github/scripts/aevorwyn-reconstruct-v6.sh
          patch --batch --forward -p1 -d aevorwyn < .aevorwyn/facing-input-green.patch

      - name: Verify and apply original Aevorwyn character patch
        run: |
          cat .aevorwyn/original-character-green.patch.gz.b64.part00 \
              .aevorwyn/original-character-green.patch.gz.b64.part01 \
              .aevorwyn/original-character-green.patch.gz.b64.part02a0 \
              .aevorwyn/original-character-green.patch.gz.b64.part02a1 \
              .aevorwyn/original-character-green.patch.gz.b64.part02b \
              .aevorwyn/original-character-green.patch.gz.b64.part02c \
              .aevorwyn/original-character-green.patch.gz.b64.part03 \
              .aevorwyn/original-character-green.patch.gz.b64.part04 > /tmp/original-character-green.b64
          echo "B64_SIZE=$(wc -c < /tmp/original-character-green.b64)"
          echo "B64_SHA=$(sha256sum /tmp/original-character-green.b64 | awk '{print $1}')"
          test "$(wc -c < /tmp/original-character-green.b64)" = "24116"
          test "$(sha256sum /tmp/original-character-green.b64 | awk '{print $1}')" = "29d2aa986cad81a42100bb6654b57a7c431f17f1aa3e8e6cecb657ca6b27b01c"
          base64 -d /tmp/original-character-green.b64 | gzip -d > /tmp/original-character-green.patch
          echo "PATCH_SIZE=$(wc -c < /tmp/original-character-green.patch)"
          echo "PATCH_SHA=$(sha256sum /tmp/original-character-green.patch | awk '{print $1}')"
          test "$(sha256sum /tmp/original-character-green.patch | awk '{print $1}')" = "b823936b82c3cb614147046a5acb190e00d7e6a5cbcf5c019171a0afda6802f6"
          patch --batch --forward -p1 -d aevorwyn < /tmp/original-character-green.patch
          patch --batch --forward -p1 -d aevorwyn < .aevorwyn/original-character-compile-fix.patch
          patch --batch --forward -p1 -d aevorwyn < .aevorwyn/original-character-test-fix.patch
          patch --batch --forward -p1 -d aevorwyn < .aevorwyn/original-character-refcount-test-fix.patch

      - name: Reject production vendor asset references
        working-directory: aevorwyn
        run: |
          python3 tools/static_verify.py
          if grep -R -n -E 'assets/vendor/|quaternius|UAL2_Standard|Male_Ranger|Axe_Bronze' src scenes; then
            echo 'Production still references vendor assets.' >&2
            exit 1
          fi

      - name: Download Godot 4.7.2
        run: |
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
          echo "$PWD/godot-bin" >> "$GITHUB_PATH"

      - name: Strict Godot import
        working-directory: aevorwyn
        run: |
          set -o pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Invalid call\.|Condition "!is_inside_tree\(\)" is true' godot-import.log; then
            exit 1
          fi

      - name: Full regression suite
        working-directory: aevorwyn
        run: |
          set -o pipefail
          timeout 45s Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s tests/test_runner.gd 2>&1 | tee godot-tests.log
          grep -q 'ALL TESTS PASSED' godot-tests.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Invalid call\.|TEST FAILURES|Condition "!is_inside_tree\(\)" is true' godot-tests.log; then
            exit 1
          fi

      - name: Strict main scene boot
        working-directory: aevorwyn
        run: |
          set -o pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 3 2>&1 | tee godot-smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Invalid call\.|Condition "!is_inside_tree\(\)" is true' godot-smoke.log; then
            exit 1
          fi
