name: Verify BillNest Live Auth

on:
  push:
    branches: [ billnest-apk-build ]
  workflow_dispatch:

jobs:
  verify-live-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare auth deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            health=$(curl -fsS 'https://billnest-api.joshselusion.workers.dev/health' || true)
            output=$(curl -sS -w '\n%{http_code}' \
              -X POST 'https://billnest-api.joshselusion.workers.dev/api/auth/login' \
              -H 'content-type: application/json' \
              --data '{"username":"billnest_deploy_probe","password":"not-a-real-password-123"}' || true)
            body=$(printf '%s\n' "$output" | sed '$d')
            status=$(printf '%s\n' "$output" | tail -n 1)
            echo "Attempt $attempt health=$health auth=HTTP-$status $body"
            if [[ "$health" == *'"authKdfIterations":100000'* && "$status" == "401" && "$body" == *"Invalid username or password"* ]]; then
              echo "Live BillNest auth routes and 100000-iteration KDF build are deployed."
              exit 0
            fi
            sleep 10
          done
          echo "Live Worker did not expose the expected auth/KDF build in time."
          exit 1
