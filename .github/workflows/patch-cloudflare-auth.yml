name: Patch Cloudflare Auth

on:
  push:
    branches: [ billnest-apk-build ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Cloudflare API key support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/baylee/billnest/MainActivity.kt')
          s = p.read_text()
          if 'PasswordVisualTransformation' not in s:
              s = s.replace('import androidx.compose.ui.platform.LocalContext\n', 'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.text.input.PasswordVisualTransformation\n')
          s = s.replace('BankApi.exchangePublicToken(url, token, institution)', 'BankApi.exchangePublicToken(url, vm.data.value.backendApiKey, token, institution)')
          s = s.replace('BankApi.fetchAccounts(url)', 'BankApi.fetchAccounts(url, vm.data.value.backendApiKey)')
          s = s.replace('BankApi.createLinkToken(url)', 'BankApi.createLinkToken(url, vm.data.value.backendApiKey)')
          if 'var backendApiKey by remember(data.backendApiKey)' not in s:
              s = s.replace('var backendUrl by remember(data.backendUrl) { mutableStateOf(data.backendUrl) }\n', 'var backendUrl by remember(data.backendUrl) { mutableStateOf(data.backendUrl) }\n    var backendApiKey by remember(data.backendApiKey) { mutableStateOf(data.backendApiKey) }\n')
          button = '                    Button(onClick = { vm.backendUrl(backendUrl) }) { Text("Save server address") }'
          if button in s:
              replacement = '''                    OutlinedTextField(
                        value = backendApiKey,
                        onValueChange = { backendApiKey = it },
                        label = { Text("Bank server key") },
                        visualTransformation = PasswordVisualTransformation(),
                        supportingText = { Text("Private key used only by your BillNest app") },
                        modifier = Modifier.fillMaxWidth()
                    )
                    Button(onClick = {
                        vm.backendUrl(backendUrl)
                        vm.backendApiKey(backendApiKey)
                    }) { Text("Save bank connection") }'''
              s = s.replace(button, replacement, 1)
          s = s.replace('Your Plaid secret stays on this server and is never stored in the APK.', 'Your Plaid secret stays on Cloudflare and is never stored in the APK.')
          s = s.replace('item { Text("BillNest v1.3.0") }', 'item { Text("BillNest v1.4.0") }')
          p.write_text(s)

          g = Path('app/build.gradle.kts')
          t = g.read_text()
          t = t.replace('versionCode = 5', 'versionCode = 6')
          t = t.replace('versionName = "1.3.0"', 'versionName = "1.4.0"')
          g.write_text(t)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/baylee/billnest/MainActivity.kt app/build.gradle.kts
          git commit -m "Add Cloudflare backend authentication settings" || exit 0
          git push
