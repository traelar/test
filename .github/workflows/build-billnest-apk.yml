name: Build BillNest APK

on:
  push:
    branches: [ billnest-apk-build, billnest-v2-foundation ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate Cloudflare Worker syntax
        run: node --check cloudflare-worker/src/index.js
      - name: Run Cloudflare Worker regression tests
        run: node --test cloudflare-worker/test/*.test.js
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Verify stable BillNest signing certificate
        run: |
          fingerprint=$(keytool -list -v -keystore app/billnest-debug.jks -storepass billnest-debug -alias billnest | sed -n 's/.*SHA256: //p' | head -n 1)
          test "$fingerprint" = "0A:A4:71:98:7E:2D:6B:34:AD:D2:CE:81:1D:F5:37:FE:8D:AE:20:3A:7B:B4:74:BB:90:CB:96:06:E3:03:65:4C"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK uses stable signing certificate
        run: |
          digest=$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          test "$digest" = "0aa471987e2d6b34add2ce811df537fe8dae203a7bb474bb90cb9606e303654c"
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BillNest-v2.0.0-alpha16-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BillNest-v2.0.0-alpha16-debug-apk
          path: BillNest-v2.0.0-alpha16-debug.apk
          if-no-files-found: error