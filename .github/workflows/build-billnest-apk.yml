name: Build BillNest APK

on:
  push:
    branches: [ billnest-apk-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Unpack BillNest
        run: unzip -q BillNest-Android-GitHub-Build.zip
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build debug APK
        working-directory: BillNest-Android
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp BillNest-Android/app/build/outputs/apk/debug/app-debug.apk BillNest-v1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BillNest-v1-debug-apk
          path: BillNest-v1-debug.apk
          if-no-files-found: error
