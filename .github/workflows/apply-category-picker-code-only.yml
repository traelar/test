name: Apply BillNest Category Picker Code

permissions:
  contents: write

on:
  push:
    branches: [ billnest-apk-build ]
    paths:
      - .github/workflows/apply-category-picker-code-only.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: billnest-apk-build
          fetch-depth: 0
      - name: Reuse validated category integration script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-category-picker-patch.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("          # Alpha29 release metadata.", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, '<category-integration>', 'exec'))
          PY

          git config user.name "BillNest CI"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/baylee/billnest/BillEditorDialogV2.kt \
                  app/src/main/java/com/baylee/billnest/Alpha19FinanceScreens.kt \
                  app/src/main/java/com/baylee/billnest/BudgetPageV2.kt \
                  app/src/main/java/com/baylee/billnest/InsightsPageV5.kt
          git diff --cached --check
          git commit -m "feat: unify BillNest category pickers and fix Insights actions"
          git push origin HEAD:billnest-apk-build
