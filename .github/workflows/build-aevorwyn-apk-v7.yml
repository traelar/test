name: Build Aevorwyn Android APK v7

concurrency:
  group: aevorwyn-android-v7-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ aevorwyn-mobile-build ]
    paths:
      - 'aevorwyn-build-trigger-v7.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Reconstruct verified Aevorwyn source
        run: |
          bash .github/scripts/aevorwyn-reconstruct-v6.sh
          patch --batch --forward -p1 -d aevorwyn < .aevorwyn/facing-input-red.patch
          patch --batch --forward -p1 -d aevorwyn < .aevorwyn/facing-input-green.patch

      - name: Download corrected CC0 assets
        run: bash .github/scripts/aevorwyn-assets-v7.sh

      - name: Download Godot 4.7.2
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
          echo "$PWD/godot-bin" >> "$GITHUB_PATH"

      - name: Install Godot export templates
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -o templates.tpz
          rm -rf templates
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -R templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF2

      - name: Strict compile, test and main-scene validation
        run: bash .github/scripts/aevorwyn-validate-v7.sh

      - name: Set Android update version
        working-directory: aevorwyn
        run: |
          sed -i "s/^version\/code=.*/version\/code=$((800 + GITHUB_RUN_NUMBER))/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.3.1-${GITHUB_RUN_NUMBER}\"/" export_presets.cfg
          grep -q '^package/unique_name="com.aevorwyn.game"' export_presets.cfg

      - name: Export signed ARM64 APK with preserved signing identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/build-aevorwyn-apk-v5.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if line.strip() == '- name: Export signed ARM64 APK')
          run_line = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'run: |')
          end = next((i for i in range(run_line + 1, len(src)) if src[i].startswith('      - name: ')), len(src))
          body = []
          for line in src[run_line + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/aevorwyn-export.sh').write_text('set -euo pipefail\n' + '\n'.join(body) + '\n')
          PY
          cd aevorwyn
          bash /tmp/aevorwyn-export.sh

      - name: Verify update identity and APK integrity
        run: |
          test -s aevorwyn/builds/android/Aevorwyn-S25-Ultra.apk
          digest=$($ANDROID_HOME/build-tools/36.1.0/apksigner verify --print-certs aevorwyn/builds/android/Aevorwyn-S25-Ultra.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          test "$digest" = "0aa471987e2d6b34add2ce811df537fe8dae203a7bb474bb90cb9606e303654c"
          $ANDROID_HOME/build-tools/36.1.0/apksigner verify --verbose aevorwyn/builds/android/Aevorwyn-S25-Ultra.apk
          sha256sum aevorwyn/builds/android/Aevorwyn-S25-Ultra.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aevorwyn-S25-Ultra-APK-v7
          path: aevorwyn/builds/android/Aevorwyn-S25-Ultra.apk
          if-no-files-found: error
