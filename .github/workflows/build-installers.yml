name: Build Clear Choice v1.3.0 Release

on:
  push:
    branches: [ clear-choice-v1.2-release ]
  workflow_dispatch:

jobs:
  android:
    name: Android v1.3.0 Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify v1.3.0 source
        shell: bash
        run: |
          export PYTHONUTF8=1
          cat build-source/v120-app.raw00 build-source/v120-app.raw01 build-source/v120-app.raw02 build-source/v120-app.raw03 build-source/v120-app.raw04 build-source/v120-app.raw05 build-source/v120-app.raw06 build-source/v120-app.raw07 > app.js
          cat build-source/v120-index.raw00 build-source/v120-index.raw01 build-source/v120-index.raw02 > index.html
          cp build-source/v120-styles.raw00 styles.css
          python build-source/v121-normalize.py
          python build-source/v121-patch1.py
          python build-source/v121-patch2.py
          python build-source/v122-patch.py
          cat build-source/final-logo.00 build-source/final-logo.01 build-source/final-logo.02 build-source/final-logo.03 build-source/final-logo.04 build-source/final-logo.05 | base64 -d > brand-logo.png
          python build-source/v123-final.py
          python build-source/v123-settings-protect.py
          sed -i 's/512x512/256x256/' manifest.json
          python build-source/v124-auto-route.py
          python build-source/v125-sync-safety.py
          python build-source/v126-s25-controls.py
          python build-source/v127-vehicle-persistence.py
          python build-source/v128-missing-address-warning.py
          python build-source/v130-polish.py
          node --check app.js
          node --check electron-main.cjs
          node --check preload.cjs
          node -e "const p=require('./package.json');if(p.version!=='1.3.0'||p.dependencies['@capacitor/app-launcher']!=='latest-7')process.exit(1)"
          node -e "const fs=require('fs');const b=fs.readFileSync('brand-logo.png');if(b.length<24||b.readUInt32BE(16)!==256||b.readUInt32BE(20)!==256)process.exit(1)"
          grep -Fq "mergeCloudStates" app.js
          grep -Fq "mergedVehicles" app.js
          grep -Fq "No Address Saved" app.js
          grep -Fq "openGoogleVoiceText" app.js
          grep -Fq "openGoogleVoiceCall" app.js
          grep -Fq "pasteMapsKey" app.js
          grep -Fq "testMapsSetup" app.js
          grep -Fq "CONFIG.googleMapsApiKey" app.js
          grep -Fq "mapsKeyStatus" index.html
          grep -Fq "Google Voice business line" index.html
          grep -Fq "Clear Choice midnight theme" styles.css
          grep -Fq "max(env(safe-area-inset-bottom),52px)" styles.css
          grep -Fq "clear-choice-v130" service-worker.js
          grep -Fq "gyiykhjgiicszmoigjaw.supabase.co" config.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare Android project and Google Voice bridge
        shell: bash
        run: |
          export PYTHONUTF8=1
          rm -rf www android
          mkdir -p www
          cp index.html styles.css app.js config.js manifest.json brand-logo.png service-worker.js www/
          npx cap add android
          npx cap sync android
          sed -i 's/versionCode 1/versionCode 130/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.3.0"/' android/app/build.gradle
          cp brand-logo.png android/app/src/main/res/drawable/brand_logo.png
          python - <<'PY'
          from pathlib import Path
          import base64
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          s=manifest.read_text(encoding='utf-8')
          permissions=('    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n' '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n')
          if 'android.permission.ACCESS_COARSE_LOCATION' not in s:
              s=s.replace('    <application',permissions+'    <application',1)
          if 'com.google.android.apps.googlevoice' not in s:
              s=s.replace('    <application','    <queries>\n        <package android:name="com.google.android.apps.googlevoice" />\n    </queries>\n    <application',1)
          s=s.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/brand_logo"')
          s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/brand_logo"')
          manifest.write_text(s,encoding='utf-8')
          mains=list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          if not mains: raise SystemExit('MainActivity.java not found')
          main=mains[0]
          src=main.read_text(encoding='utf-8')
          package=next((line.split()[1].rstrip(';') for line in src.splitlines() if line.strip().startswith('package ')),None)
          if not package: raise SystemExit('Android package not found')
          template=base64.b64decode('').decode('utf-8').replace('__PACKAGE__',package)
          (main.parent/'GoogleVoicePlugin.java').write_text(template,encoding='utf-8')
          if 'registerPlugin(GoogleVoicePlugin.class)' not in src:
              src=src.replace('import com.getcapacitor.BridgeActivity;','import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;',1)
              src=src.replace('public class MainActivity extends BridgeActivity {}','public class MainActivity extends BridgeActivity {\n  @Override\n  public void onCreate(Bundle savedInstanceState) {\n    registerPlugin(GoogleVoicePlugin.class);\n    super.onCreate(savedInstanceState);\n  }\n}',1)
          main.write_text(src,encoding='utf-8')
          PY
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.apps.googlevoice' android/app/src/main/AndroidManifest.xml
          grep -Rqs 'registerPlugin(GoogleVoicePlugin.class)' android/app/src/main/java
          grep -Rqs '@CapacitorPlugin(name = "GoogleVoice")' android/app/src/main/java
          grep -Rqs 'AppLauncher' android/app/src/main || { echo 'AppLauncher plugin not registered'; exit 1; }
      - name: Build aligned release APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk Clear-Choice-Cleaning-Android-v1.3.0-aligned-unsigned.apk
          cp "$BT/lib/apksigner.jar" apksigner.jar
          test -s Clear-Choice-Cleaning-Android-v1.3.0-aligned-unsigned.apk
          test -s apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Clear-Choice-Cleaning-v1.3.0-Release-Unsigned
          path: |
            Clear-Choice-Cleaning-Android-v1.3.0-aligned-unsigned.apk
            apksigner.jar
          if-no-files-found: error

  windows:
    name: Windows v1.3.0 EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify v1.3.0 source
        shell: bash
        run: |
          export PYTHONUTF8=1
          sed -i 's/\r$//' build-source/v120-app.raw00 build-source/v120-app.raw01 build-source/v120-app.raw02 build-source/v120-app.raw03 build-source/v120-app.raw04 build-source/v120-app.raw05 build-source/v120-app.raw06 build-source/v120-app.raw07 build-source/v120-index.raw00 build-source/v120-index.raw01 build-source/v120-index.raw02 build-source/v120-styles.raw00
          cat build-source/v120-app.raw00 build-source/v120-app.raw01 build-source/v120-app.raw02 build-source/v120-app.raw03 build-source/v120-app.raw04 build-source/v120-app.raw05 build-source/v120-app.raw06 build-source/v120-app.raw07 > app.js
          cat build-source/v120-index.raw00 build-source/v120-index.raw01 build-source/v120-index.raw02 > index.html
          cp build-source/v120-styles.raw00 styles.css
          python build-source/v121-normalize.py
          python build-source/v121-patch1.py
          python build-source/v121-patch2.py
          python build-source/v122-patch.py
          cat build-source/final-logo.00 build-source/final-logo.01 build-source/final-logo.02 build-source/final-logo.03 build-source/final-logo.04 build-source/final-logo.05 | base64 -d > brand-logo.png
          python build-source/v123-final.py
          python build-source/v123-settings-protect.py
          sed -i 's/512x512/256x256/' manifest.json
          python build-source/v124-auto-route.py
          python build-source/v125-sync-safety.py
          python build-source/v126-s25-controls.py
          python build-source/v127-vehicle-persistence.py
          python build-source/v128-missing-address-warning.py
          python build-source/v130-polish.py
          sed -i 's/\r$//' app.js index.html styles.css electron-main.cjs preload.cjs package.json manifest.json service-worker.js config.js
          node --check app.js
          node --check electron-main.cjs
          node --check preload.cjs
          node -e "const p=require('./package.json');if(p.version!=='1.3.0')process.exit(1)"
          grep -Fq "openGoogleVoiceText" app.js
          grep -Fq "pasteMapsKey" app.js
          grep -Fq "No Address Saved" app.js
          grep -Fq "Clear Choice midnight theme" styles.css
          grep -Fq "gyiykhjgiicszmoigjaw.supabase.co" config.js
          grep -Fq "clear-choice-v130" service-worker.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Windows executable
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Clear-Choice-Cleaning-Windows-v1.3.0
          path: dist/*.exe
          if-no-files-found: error
