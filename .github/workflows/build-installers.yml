name: Build Clear Choice v1.2.4 Release

on:
  push:
    branches: [ clear-choice-v1.2-release ]
  workflow_dispatch:

jobs:
  android:
    name: Android v1.2.4 Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify v1.2.4 source
        shell: bash
        run: |
          export PYTHONUTF8=1
          cat build-source/v120-app.raw00 build-source/v120-app.raw01 build-source/v120-app.raw02 build-source/v120-app.raw03 build-source/v120-app.raw04 build-source/v120-app.raw05 build-source/v120-app.raw06 build-source/v120-app.raw07 > app.js
          cat build-source/v120-index.raw00 build-source/v120-index.raw01 build-source/v120-index.raw02 > index.html
          cp build-source/v120-styles.raw00 styles.css
          python build-source/v121-normalize.py
          python build-source/v121-patch1.py
          python build-source/v121-patch2.py
          python build-source/v122-patch.py
          cat build-source/final-logo.00 build-source/final-logo.01 build-source/final-logo.02 build-source/final-logo.03 build-source/final-logo.04 build-source/final-logo.05 | base64 -d > brand-logo.png
          python build-source/v123-final.py
          python build-source/v123-settings-protect.py
          sed -i 's/512x512/256x256/' manifest.json
          python build-source/v124-auto-route.py
          node --check app.js
          node --check electron-main.cjs
          node --check preload.cjs
          node -e "const fs=require('fs');const b=fs.readFileSync('brand-logo.png');if(b.length<24||b.readUInt32BE(16)!==256||b.readUInt32BE(20)!==256)process.exit(1)"
          test "$(node -p "require('./package.json').version")" = "1.2.4"
          grep -Fq "computeRoutePlan" app.js
          grep -Fq "recalculateRouteDate" app.js
          grep -Fq "plannedDriveMinutes" app.js
          grep -Fq "routeStartAddress" app.js
          grep -Fq "routeBufferMinutes" app.js
          grep -Fq "recalculateTodayRouteBtn" index.html
          grep -Fq "Exit Appointment" index.html
          grep -Fq "safe-area-inset-bottom" styles.css
          grep -Fq "clear-choice-v124" service-worker.js
          grep -Fq "JSON.stringify(s?.settings||{})!==JSON.stringify(base.settings)" app.js
          grep -Fq "await restorePersistentState()" app.js
          grep -Fq "await restorePersistentAuth()" app.js
          grep -Fq "s.settings&&Object.keys(s.settings).length" electron-main.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare Android project
        shell: bash
        run: |
          export PYTHONUTF8=1
          rm -rf www android
          mkdir -p www
          cp index.html styles.css app.js config.js manifest.json brand-logo.png service-worker.js www/
          npx cap add android
          npx cap sync android
          sed -i 's/versionCode 1/versionCode 124/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.2.4"/' android/app/build.gradle
          cp brand-logo.png android/app/src/main/res/drawable/brand_logo.png
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          permissions=('    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n' '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n')
          if 'android.permission.ACCESS_COARSE_LOCATION' not in s:
              s=s.replace('    <application',permissions+'    <application',1)
          s=s.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/brand_logo"')
          s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/brand_logo"')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q '@drawable/brand_logo' android/app/src/main/AndroidManifest.xml
      - name: Build aligned release APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk Clear-Choice-Cleaning-Android-v1.2.4-aligned-unsigned.apk
          cp "$BT/lib/apksigner.jar" apksigner.jar
          test -s Clear-Choice-Cleaning-Android-v1.2.4-aligned-unsigned.apk
          test -s apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Clear-Choice-Cleaning-v1.2.4-Release-Unsigned
          path: |
            Clear-Choice-Cleaning-Android-v1.2.4-aligned-unsigned.apk
            apksigner.jar
          if-no-files-found: error

  windows:
    name: Windows v1.2.4 EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify v1.2.4 source
        shell: bash
        run: |
          export PYTHONUTF8=1
          sed -i 's/\r$//' build-source/v120-app.raw00 build-source/v120-app.raw01 build-source/v120-app.raw02 build-source/v120-app.raw03 build-source/v120-app.raw04 build-source/v120-app.raw05 build-source/v120-app.raw06 build-source/v120-app.raw07 build-source/v120-index.raw00 build-source/v120-index.raw01 build-source/v120-index.raw02 build-source/v120-styles.raw00
          cat build-source/v120-app.raw00 build-source/v120-app.raw01 build-source/v120-app.raw02 build-source/v120-app.raw03 build-source/v120-app.raw04 build-source/v120-app.raw05 build-source/v120-app.raw06 build-source/v120-app.raw07 > app.js
          cat build-source/v120-index.raw00 build-source/v120-index.raw01 build-source/v120-index.raw02 > index.html
          cp build-source/v120-styles.raw00 styles.css
          python build-source/v121-normalize.py
          python build-source/v121-patch1.py
          python build-source/v121-patch2.py
          python build-source/v122-patch.py
          cat build-source/final-logo.00 build-source/final-logo.01 build-source/final-logo.02 build-source/final-logo.03 build-source/final-logo.04 build-source/final-logo.05 | base64 -d > brand-logo.png
          python build-source/v123-final.py
          python build-source/v123-settings-protect.py
          sed -i 's/512x512/256x256/' manifest.json
          python build-source/v124-auto-route.py
          sed -i 's/\r$//' app.js index.html styles.css electron-main.cjs preload.cjs package.json manifest.json service-worker.js
          node --check app.js
          node --check electron-main.cjs
          node --check preload.cjs
          node -e "const fs=require('fs');const b=fs.readFileSync('brand-logo.png');if(b.length<24||b.readUInt32BE(16)!==256||b.readUInt32BE(20)!==256)process.exit(1)"
          test "$(node -p "require('./package.json').version")" = "1.2.4"
          grep -Fq "computeRoutePlan" app.js
          grep -Fq "recalculateRouteDate" app.js
          grep -Fq "plannedDriveMinutes" app.js
          grep -Fq "routeStartAddress" app.js
          grep -Fq "routeBufferMinutes" app.js
          grep -Fq "recalculateTodayRouteBtn" index.html
          grep -Fq "Exit Appointment" index.html
          grep -Fq "safe-area-inset-bottom" styles.css
          grep -Fq "clear-choice-v124" service-worker.js
          grep -Fq "JSON.stringify(s?.settings||{})!==JSON.stringify(base.settings)" app.js
          grep -Fq "await restorePersistentState()" app.js
          grep -Fq "await restorePersistentAuth()" app.js
          grep -Fq "s.settings&&Object.keys(s.settings).length" electron-main.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Windows executable
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Clear-Choice-Cleaning-Windows-v1.2.4
          path: dist/*.exe
          if-no-files-found: error
