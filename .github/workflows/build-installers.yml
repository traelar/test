name: Build Clear Choice v1.2 Release

on:
  push:
    branches: [ clear-choice-v1.2-release ]
  workflow_dispatch:

jobs:
  android:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble verified v1.2 source
        shell: bash
        run: |
          cat build-source/v120-app.raw00 build-source/v120-app.raw01 build-source/v120-app.raw02 build-source/v120-app.raw03 build-source/v120-app.raw04 build-source/v120-app.raw05 build-source/v120-app.raw06 build-source/v120-app.raw07 > app.js
          cat build-source/v120-index.raw00 build-source/v120-index.raw01 build-source/v120-index.raw02 > index.html
          cp build-source/v120-styles.raw00 styles.css
          node --check app.js
          test "$(sha256sum app.js | awk '{print $1}')" = "d2e2612be79d7e141afd3b4924b7b9f581e7d538b14658fc6456b44647386925"
          test "$(sha256sum index.html | awk '{print $1}')" = "bf90871f70851bf77668971d97f5c946c5f6aee5c6ae7bfec57b1dc580889442"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare Android project
        shell: bash
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html styles.css app.js config.js manifest.json icon.svg service-worker.js www/
          npx cap add android
          npx cap sync android
          sed -i 's/versionCode 1/versionCode 120/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.2.0"/' android/app/build.gradle
      - name: Build aligned release APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk Clear-Choice-Cleaning-Android-v1.2.0-aligned-unsigned.apk
          cp "$BT/lib/apksigner.jar" apksigner.jar
          test -s Clear-Choice-Cleaning-Android-v1.2.0-aligned-unsigned.apk
          test -s apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Clear-Choice-Cleaning-v1.2-Release-Unsigned
          path: |
            Clear-Choice-Cleaning-Android-v1.2.0-aligned-unsigned.apk
            apksigner.jar
          if-no-files-found: error
