name: Build Clear Choice v1.2.2 Release

on:
  push:
    branches: [ clear-choice-v1.2-release ]
  workflow_dispatch:

jobs:
  android:
    name: Android v1.2.2 Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and patch verified v1.2.2 source
        shell: bash
        run: |
          export PYTHONUTF8=1
          cat build-source/v120-app.raw00 build-source/v120-app.raw01 build-source/v120-app.raw02 build-source/v120-app.raw03 build-source/v120-app.raw04 build-source/v120-app.raw05 build-source/v120-app.raw06 build-source/v120-app.raw07 > app.js
          cat build-source/v120-index.raw00 build-source/v120-index.raw01 build-source/v120-index.raw02 > index.html
          cp build-source/v120-styles.raw00 styles.css
          python build-source/v121-normalize.py
          python build-source/v121-patch1.py
          python build-source/v121-patch2.py
          python build-source/v122-patch.py
          node --check app.js
          sha256sum app.js index.html styles.css config.js package.json
          test "$(sha256sum app.js | awk '{print $1}')" = "4c5a03ffd74d2de8c307738a015b75cd946098620e4cc60f62c477472b9eed04"
          test "$(sha256sum index.html | awk '{print $1}')" = "4ca2c009f683859a5d99f51db55424922611a18a739cc88a31c4bf257bcc6d0c"
          test "$(sha256sum styles.css | awk '{print $1}')" = "54f90cc7da6444516a84272bba7d3abb42397ec87ca78040153ec49ea24608ad"
          test "$(sha256sum config.js | awk '{print $1}')" = "d648ec88a11323e419e91a26c762fd1369ec6ea7ae02cc7f43b0799cf9534703"
          test "$(node -p "require('./package.json').version")" = "1.2.2"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare Android project
        shell: bash
        run: |
          export PYTHONUTF8=1
          rm -rf www android
          mkdir -p www
          cp index.html styles.css app.js config.js manifest.json icon.svg service-worker.js www/
          npx cap add android
          npx cap sync android
          sed -i 's/versionCode 1/versionCode 122/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.2.2"/' android/app/build.gradle
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          permissions = (
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
          )
          if 'android.permission.ACCESS_COARSE_LOCATION' not in s:
              s = s.replace('    <application', permissions + '    <application', 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
      - name: Build aligned release APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk Clear-Choice-Cleaning-Android-v1.2.2-aligned-unsigned.apk
          cp "$BT/lib/apksigner.jar" apksigner.jar
          test -s Clear-Choice-Cleaning-Android-v1.2.2-aligned-unsigned.apk
          test -s apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Clear-Choice-Cleaning-v1.2.2-Release-Unsigned
          path: |
            Clear-Choice-Cleaning-Android-v1.2.2-aligned-unsigned.apk
            apksigner.jar
          if-no-files-found: error

  windows:
    name: Windows v1.2.2 EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and patch verified v1.2.2 source
        shell: bash
        run: |
          export PYTHONUTF8=1
          sed -i 's/\r$//' build-source/v120-app.raw00 build-source/v120-app.raw01 build-source/v120-app.raw02 build-source/v120-app.raw03 build-source/v120-app.raw04 build-source/v120-app.raw05 build-source/v120-app.raw06 build-source/v120-app.raw07 build-source/v120-index.raw00 build-source/v120-index.raw01 build-source/v120-index.raw02 build-source/v120-styles.raw00
          cat build-source/v120-app.raw00 build-source/v120-app.raw01 build-source/v120-app.raw02 build-source/v120-app.raw03 build-source/v120-app.raw04 build-source/v120-app.raw05 build-source/v120-app.raw06 build-source/v120-app.raw07 > app.js
          cat build-source/v120-index.raw00 build-source/v120-index.raw01 build-source/v120-index.raw02 > index.html
          cp build-source/v120-styles.raw00 styles.css
          python build-source/v121-normalize.py
          python build-source/v121-patch1.py
          python build-source/v121-patch2.py
          python build-source/v122-patch.py
          sed -i 's/\r$//' app.js index.html styles.css config.js package.json
          node --check app.js
          sha256sum app.js index.html styles.css config.js package.json
          test "$(sha256sum app.js | awk '{print $1}')" = "4c5a03ffd74d2de8c307738a015b75cd946098620e4cc60f62c477472b9eed04"
          test "$(sha256sum index.html | awk '{print $1}')" = "4ca2c009f683859a5d99f51db55424922611a18a739cc88a31c4bf257bcc6d0c"
          test "$(sha256sum styles.css | awk '{print $1}')" = "54f90cc7da6444516a84272bba7d3abb42397ec87ca78040153ec49ea24608ad"
          test "$(sha256sum config.js | awk '{print $1}')" = "d648ec88a11323e419e91a26c762fd1369ec6ea7ae02cc7f43b0799cf9534703"
          test "$(node -p "require('./package.json').version")" = "1.2.2"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Windows executable
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Clear-Choice-Cleaning-Windows-v1.2.2
          path: dist/*.exe
          if-no-files-found: error
