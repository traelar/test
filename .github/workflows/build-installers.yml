name: Build Clear Choice v1.2.3 Release

on:
  push:
    branches: [ clear-choice-v1.2-release ]
  workflow_dispatch:

jobs:
  android:
    name: Android v1.2.3 Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify v1.2.3 source
        shell: bash
        run: |
          export PYTHONUTF8=1
          cat build-source/v120-app.raw00 build-source/v120-app.raw01 build-source/v120-app.raw02 build-source/v120-app.raw03 build-source/v120-app.raw04 build-source/v120-app.raw05 build-source/v120-app.raw06 build-source/v120-app.raw07 > app.js
          cat build-source/v120-index.raw00 build-source/v120-index.raw01 build-source/v120-index.raw02 > index.html
          cp build-source/v120-styles.raw00 styles.css
          python build-source/v121-normalize.py
          python build-source/v121-patch1.py
          python build-source/v121-patch2.py
          python build-source/v122-patch.py
          base64 -d build-source/brand-logo.b64 > brand-logo.png
          python build-source/v123-final.py
          sed -i 's/512x512/128x128/' manifest.json
          node --check app.js
          node --check electron-main.cjs
          node --check preload.cjs
          test "$(sha256sum app.js | awk '{print $1}')" = "9b7cbc4bcd6ea0c174383aea3b3b2519b874584b23204c4b84b9c135a51015dd"
          test "$(sha256sum index.html | awk '{print $1}')" = "b4118b388e9c5f3cfed868554652cf0754b7e2d4ea51b6ba91e8e3046e163af6"
          test "$(sha256sum styles.css | awk '{print $1}')" = "fc709e827c37a7ad487bd8b795a48273a24e1c6f03c473d7bfecf6b7e2568ef3"
          test "$(sha256sum electron-main.cjs | awk '{print $1}')" = "f9bc59a1e2f8bf02d6aef4a56873c5e6db63c0b5c9944c73b31cbf97a729b40f"
          test "$(sha256sum preload.cjs | awk '{print $1}')" = "c93a5560bfbad1c5bd4ff81864ffa5b7665817d05c628beadfc9eb9161a14170"
          test "$(sha256sum package.json | awk '{print $1}')" = "efc0098aee26828588c53def994faa169ef30f2ba521556aa525de9dc1c90883"
          test "$(sha256sum manifest.json | awk '{print $1}')" = "f949889772a3522c8cdd082d894989c54d559873cd9119d5a3a72a05b7be0c6b"
          test "$(sha256sum service-worker.js | awk '{print $1}')" = "6899083a3543a05c04618b09e78ac6ffb75ebe5080e00c1480a09c9b156e2740"
          test "$(sha256sum brand-logo.png | awk '{print $1}')" = "4fc99956f31a044bf8ed35a042d7fe484da747b10f6c81e2a9c0a182ec1396c3"
          test "$(node -p "require('./package.json').version")" = "1.2.3"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare Android project
        shell: bash
        run: |
          export PYTHONUTF8=1
          rm -rf www android
          mkdir -p www
          cp index.html styles.css app.js config.js manifest.json brand-logo.png service-worker.js www/
          npx cap add android
          npx cap sync android
          sed -i 's/versionCode 1/versionCode 123/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.2.3"/' android/app/build.gradle
          cp brand-logo.png android/app/src/main/res/drawable/brand_logo.png
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(encoding='utf-8')
          permissions=('    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n' '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n')
          if 'android.permission.ACCESS_COARSE_LOCATION' not in s:
              s=s.replace('    <application',permissions+'    <application',1)
          s=s.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/brand_logo"')
          s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/brand_logo"')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q '@drawable/brand_logo' android/app/src/main/AndroidManifest.xml
      - name: Build aligned release APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk Clear-Choice-Cleaning-Android-v1.2.3-aligned-unsigned.apk
          cp "$BT/lib/apksigner.jar" apksigner.jar
          test -s Clear-Choice-Cleaning-Android-v1.2.3-aligned-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Clear-Choice-Cleaning-v1.2.3-Release-Unsigned
          path: |
            Clear-Choice-Cleaning-Android-v1.2.3-aligned-unsigned.apk
            apksigner.jar
          if-no-files-found: error

  windows:
    name: Windows v1.2.3 EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify v1.2.3 source
        shell: bash
        run: |
          export PYTHONUTF8=1
          sed -i 's/\r$//' build-source/v120-app.raw00 build-source/v120-app.raw01 build-source/v120-app.raw02 build-source/v120-app.raw03 build-source/v120-app.raw04 build-source/v120-app.raw05 build-source/v120-app.raw06 build-source/v120-app.raw07 build-source/v120-index.raw00 build-source/v120-index.raw01 build-source/v120-index.raw02 build-source/v120-styles.raw00
          cat build-source/v120-app.raw00 build-source/v120-app.raw01 build-source/v120-app.raw02 build-source/v120-app.raw03 build-source/v120-app.raw04 build-source/v120-app.raw05 build-source/v120-app.raw06 build-source/v120-app.raw07 > app.js
          cat build-source/v120-index.raw00 build-source/v120-index.raw01 build-source/v120-index.raw02 > index.html
          cp build-source/v120-styles.raw00 styles.css
          python build-source/v121-normalize.py
          python build-source/v121-patch1.py
          python build-source/v121-patch2.py
          python build-source/v122-patch.py
          base64 -d build-source/brand-logo.b64 > brand-logo.png
          python build-source/v123-final.py
          sed -i 's/512x512/128x128/' manifest.json
          sed -i 's/\r$//' app.js index.html styles.css electron-main.cjs preload.cjs package.json manifest.json service-worker.js
          node --check app.js
          node --check electron-main.cjs
          node --check preload.cjs
          test "$(sha256sum app.js | awk '{print $1}')" = "9b7cbc4bcd6ea0c174383aea3b3b2519b874584b23204c4b84b9c135a51015dd"
          test "$(sha256sum index.html | awk '{print $1}')" = "b4118b388e9c5f3cfed868554652cf0754b7e2d4ea51b6ba91e8e3046e163af6"
          test "$(sha256sum styles.css | awk '{print $1}')" = "fc709e827c37a7ad487bd8b795a48273a24e1c6f03c473d7bfecf6b7e2568ef3"
          test "$(sha256sum electron-main.cjs | awk '{print $1}')" = "f9bc59a1e2f8bf02d6aef4a56873c5e6db63c0b5c9944c73b31cbf97a729b40f"
          test "$(sha256sum preload.cjs | awk '{print $1}')" = "c93a5560bfbad1c5bd4ff81864ffa5b7665817d05c628beadfc9eb9161a14170"
          test "$(sha256sum package.json | awk '{print $1}')" = "efc0098aee26828588c53def994faa169ef30f2ba521556aa525de9dc1c90883"
          test "$(sha256sum manifest.json | awk '{print $1}')" = "f949889772a3522c8cdd082d894989c54d559873cd9119d5a3a72a05b7be0c6b"
          test "$(sha256sum service-worker.js | awk '{print $1}')" = "6899083a3543a05c04618b09e78ac6ffb75ebe5080e00c1480a09c9b156e2740"
          test "$(sha256sum brand-logo.png | awk '{print $1}')" = "4fc99956f31a044bf8ed35a042d7fe484da747b10f6c81e2a9c0a182ec1396c3"
          test "$(node -p "require('./package.json').version")" = "1.2.3"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Windows executable
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Clear-Choice-Cleaning-Windows-v1.2.3
          path: dist/*.exe
          if-no-files-found: error
