name: VCC Windows Build Tools

on:
  push:
    branches:
      - vcc-windows-build-tools
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Prepare generic VCC build toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vcc-tools/toolchain
          curl --fail --location --retry 3 \
            https://nodejs.org/dist/v22.16.0/win-x64/node.exe \
            --output vcc-tools/node-win-x64.exe
          echo 'c5ff4c736112dd483c750fd4149d30c8a116db1a49b8b3ec88be4b65e6c86c19  vcc-tools/node-win-x64.exe' | sha256sum -c -
          npm install --prefix vcc-tools/toolchain --no-save --no-audit --no-fund \
            esbuild@0.25.9 postject@1.0.0-alpha.6
          vcc-tools/toolchain/node_modules/.bin/esbuild --version
          node vcc-tools/toolchain/node_modules/postject/dist/cli.js --help >/dev/null
          tar -czf vcc-build-tools.tar.gz -C vcc-tools .
          sha256sum vcc-build-tools.tar.gz > vcc-build-tools.tar.gz.sha256

      - name: Upload generic toolchain
        uses: actions/upload-artifact@v4
        with:
          name: vcc-generic-build-tools
          retention-days: 3
          if-no-files-found: error
          path: |
            vcc-build-tools.tar.gz
            vcc-build-tools.tar.gz.sha256
