name: Test BillNest Plaid Backend

on:
  push:
    branches: [ billnest-apk-build ]
    paths:
      - 'backend/**'
      - '.github/workflows/test-billnest-backend.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run backend tests
        run: node --test backend/test/server.test.js
