name: Inspect Aevorwyn CC0 Assets

on:
  push:
    branches: [ aevorwyn-mobile-build ]
    paths:
      - 'aevorwyn-asset-inspect-trigger.txt'
      - '.github/workflows/inspect-aevorwyn-cc0-assets.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download selected CC0 assets
        run: |
          mkdir -p inspect
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Universal%20Animation%20Library%202%5BStandard%5D/Unreal-Godot/UAL2_Standard.glb' -o inspect/UAL2_Standard.glb
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Modular%20Character%20Outfits%20-%20Fantasy%5BStandard%5D/Exports/glTF%20(Godot-Unreal)/Outfits/Male_Peasant.gltf' -o inspect/Male_Peasant.gltf
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Modular%20Character%20Outfits%20-%20Fantasy%5BStandard%5D/Exports/glTF%20(Godot-Unreal)/Outfits/Male_Peasant.bin' -o inspect/Male_Peasant.bin
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Stylized%20Nature%20MegaKit%5BStandard%5D/glTF/CommonTree_1.gltf' -o inspect/CommonTree_1.gltf
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/agentkaerf/FreeModels/main/Stylized%20Nature%20MegaKit%5BStandard%5D/glTF/CommonTree_1.bin' -o inspect/CommonTree_1.bin
          sha256sum inspect/*

      - name: Print animation and skeleton metadata
        run: |
          python3 - <<'PY'
          import json, struct, pathlib
          p=pathlib.Path('inspect/UAL2_Standard.glb')
          data=p.read_bytes()
          magic,version,length=struct.unpack_from('<4sII',data,0)
          assert magic==b'glTF' and version==2
          off=12
          doc=None
          while off < len(data):
              chunk_len,chunk_type=struct.unpack_from('<II',data,off); off+=8
              chunk=data[off:off+chunk_len]; off+=chunk_len
              if chunk_type==0x4E4F534A:
                  doc=json.loads(chunk.decode('utf-8').rstrip('\x00 \t\r\n'))
                  break
          assert doc is not None
          print('UAL2 animation count:', len(doc.get('animations',[])))
          for a in doc.get('animations',[]):
              print('ANIM:', a.get('name','<unnamed>'))
          print('UAL2 nodes:', ','.join(n.get('name','') for n in doc.get('nodes',[]) if n.get('name')))
          peasant=json.loads(pathlib.Path('inspect/Male_Peasant.gltf').read_text())
          print('PEASANT nodes:', ','.join(n.get('name','') for n in peasant.get('nodes',[]) if n.get('name')))
          print('PEASANT animations:', [a.get('name') for a in peasant.get('animations',[])])
          tree=json.loads(pathlib.Path('inspect/CommonTree_1.gltf').read_text())
          print('TREE images:', [i.get('uri') for i in tree.get('images',[])])
          PY
