name: Build Vitality Mobile Admin APK

on:
  push:
    paths:
      - 'vrp-mobile-admin-apk/**'
      - '.github/workflows/build-vitality-mobile-admin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vrp-mobile-admin-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Vitality-Mobile-Admin-v0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vitality-Mobile-Admin-v0.1.0
          path: vrp-mobile-admin-apk/app/build/outputs/apk/release/Vitality-Mobile-Admin-v0.1.0.apk
          if-no-files-found: error
